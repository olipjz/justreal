<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jahzrel Olip | IT Student & Full-Stack Developer</title>
<meta name="description" content="Portfolio of Jahzrel Olip, IT student and full-stack developer. Projects, certifications, skills and resume.">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }

:root {
  color-scheme: light;
  --paper: #f6f3ec;
  --card: #ffffff;
  --tint: #e9eef8;
  --blush: #fbeceb;
  --ink: #14213d;
  --muted: #53607a;
  --line: #ddd7c9;
  --crimson: #b3202a;
  --crimson-dark: #8e1822;
  --gold: #b8892b;
  --radius: 4px;
  --font: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { scroll-padding-top: calc(80px + env(safe-area-inset-top, 0px)); scroll-behavior: smooth; }
body {
  margin: 0; font-family: var(--font); background: var(--paper); color: var(--ink);
  line-height: 1.65; -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; display: block; }
a { color: inherit; }
h1, h2, h3, h4 { margin: 0; line-height: 1.1; letter-spacing: -0.02em; font-weight: 800; }
p { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }
.container { max-width: 1160px; margin: 0 auto; padding: 0 1.5rem; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
:focus-visible { outline: 3px solid var(--crimson); outline-offset: 3px; }
#view:focus { outline: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ── NAV ── */
.nav {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50;
  background: rgba(255,255,255,.97); border-bottom: 3px solid var(--crimson);
}
.nav-inner {
  max-width: 1160px; margin: 0 auto; padding: 0 1.5rem; height: 68px;
  display: flex; align-items: center; justify-content: center;
}
.nav-links { display: flex; align-items: center; gap: .25rem; }
.nav-links a {
  text-decoration: none; font-size: .8rem; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--muted); padding: .55rem .9rem; position: relative;
  transition: color .15s;
}
.nav-links a:hover { color: var(--ink); }
.nav-links a[aria-current="page"] { color: var(--ink); }
.nav-links a[aria-current="page"]::after {
  content: ''; position: absolute; left: .9rem; right: .9rem; bottom: .1rem; height: 3px; background: var(--crimson);
}
.nav-links a.nav-cta {
  background: var(--crimson); color: #fff; margin-left: .75rem; border-radius: var(--radius);
}
.nav-links a.nav-cta:hover { background: var(--crimson-dark); color: #fff; }
.nav-links a.nav-cta[aria-current="page"]::after { display: none; }
.nav-toggle {
  display: none; margin-left: auto; background: none; border: 2px solid var(--ink);
  border-radius: var(--radius); padding: .5rem .7rem; cursor: pointer; font: 800 .75rem var(--font);
  letter-spacing: .1em; text-transform: uppercase; color: var(--ink);
}

/* ── BUTTONS / TAGS ── */
.btn {
  display: inline-flex; align-items: center; gap: .5rem; padding: .85rem 1.6rem;
  border: 2px solid var(--ink); border-radius: var(--radius); background: transparent; color: var(--ink);
  font: 800 .8rem/1 var(--font); letter-spacing: .1em; text-transform: uppercase; text-decoration: none;
  cursor: pointer; transition: transform .15s, box-shadow .15s, background .15s, color .15s;
}
.btn:hover { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 var(--ink); }
.btn-primary { background: var(--crimson); border-color: var(--crimson); color: #fff; }
.btn-primary:hover { background: var(--crimson-dark); border-color: var(--crimson-dark); box-shadow: 5px 5px 0 var(--ink); }
.btn-light { background: #fff; border-color: #fff; color: var(--crimson-dark); }
.btn-light:hover { box-shadow: 5px 5px 0 var(--ink); }
.tags { display: flex; flex-wrap: wrap; gap: .4rem; }
.tag {
  display: inline-block; padding: .2rem .6rem; font-size: .74rem; font-weight: 700;
  background: var(--tint); color: var(--ink); border-radius: 3px;
}
.tag.red { background: var(--blush); color: var(--crimson-dark); }

/* ── HERO ── */
.hero { position: relative; overflow: hidden; background: var(--paper); }
.hero::before {
  content: ''; position: absolute; width: 520px; height: 520px; border-radius: 50%;
  background: var(--blush); top: -220px; left: -160px;
}
.hero::after {
  content: ''; position: absolute; width: 460px; height: 460px; border-radius: 50%;
  background: var(--tint); bottom: -200px; right: -140px;
}
.hero-inner {
  position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center;
  text-align: center; padding: 4.5rem 1.5rem 4rem;
}
.portrait {
  width: 230px; height: 290px; position: relative; margin-bottom: 2.5rem;
  border: 6px solid #fff; background: #fff; box-shadow: 14px 14px 0 var(--crimson);
}
.portrait img { width: 100%; height: 100%; object-fit: cover; }
.badge {
  display: inline-flex; align-items: center; gap: .55rem; padding: .4rem .9rem; margin-bottom: 1.25rem;
  background: #fff; border: 2px solid var(--ink); border-radius: var(--radius);
  font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
}
.badge .dot { width: 9px; height: 9px; border-radius: 50%; background: #1f9d55; }
.name {
  font-size: clamp(3.1rem, 10.5vw, 7.2rem); font-weight: 800; text-transform: uppercase;
  letter-spacing: -0.035em; line-height: .95; margin-bottom: 1.1rem;
}
.name em { font-style: normal; color: var(--crimson); }
.role {
  display: flex; align-items: center; gap: 1rem; width: 100%; max-width: 640px; margin-bottom: 1.4rem;
  font-size: clamp(.8rem, 2vw, 1rem); font-weight: 800; letter-spacing: .24em; text-transform: uppercase; color: var(--muted);
}
.role::before, .role::after { content: ''; flex: 1; height: 2px; background: var(--ink); opacity: .85; }
.lead { max-width: 640px; font-size: 1.1rem; color: var(--muted); margin-bottom: 2rem; }
.cta { display: flex; flex-wrap: wrap; gap: .9rem; justify-content: center; }
.stats { background: var(--crimson); color: #fff; }
.stats-inner { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
.stat { padding: 1.6rem 1rem; border-right: 1px solid rgba(255,255,255,.28); }
.stat:last-child { border-right: 0; }
.stat b { display: block; font-size: clamp(1.9rem, 5vw, 2.8rem); font-weight: 800; line-height: 1; }
.stat span { font-size: .75rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; opacity: .92; }

/* ── SECTIONS ── */
.section { padding: 5rem 0; }
.bg-white { background: #fff; }
.bg-tint { background: var(--tint); }
.eyebrow { font-size: .78rem; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: var(--crimson); margin-bottom: .75rem; }
.h2 { font-size: clamp(1.9rem, 4.4vw, 2.9rem); margin-bottom: 1.1rem; }
.h2::after { content: ''; display: block; width: 64px; height: 5px; background: var(--crimson); margin-top: 1rem; }
.section-lead { max-width: 640px; color: var(--muted); margin-bottom: 2.5rem; }
.section-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; flex-wrap: wrap; }
.link-more { font-weight: 800; font-size: .85rem; letter-spacing: .08em; text-transform: uppercase; color: var(--crimson); text-decoration: none; }
.link-more:hover { text-decoration: underline; }

.page-head { background: var(--tint); border-bottom: 1px solid var(--line); padding: 3.5rem 0 3rem; }
.crumbs { font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 1rem; }
.crumbs a { text-decoration: none; color: var(--crimson); }
.crumbs a:hover { text-decoration: underline; }
.page-head h1 { font-size: clamp(2.4rem, 7vw, 4.4rem); text-transform: uppercase; letter-spacing: -0.03em; }
.page-head p { max-width: 640px; color: var(--muted); margin-top: 1rem; font-size: 1.05rem; }
.page-body { padding: 4rem 0 5rem; }

/* ── CARDS ── */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
.grid { display: grid; gap: 1.5rem; }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.project-card { display: flex; flex-direction: column; text-decoration: none; overflow: hidden; border-top: 4px solid var(--crimson); transition: transform .18s, box-shadow .18s; }
.project-card:hover { transform: translate(-3px,-3px); box-shadow: 8px 8px 0 var(--ink); }
.thumb { aspect-ratio: 16 / 9; background: var(--tint); overflow: hidden; border-bottom: 1px solid var(--line); }
.thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
.pc-body { padding: 1.4rem 1.5rem 1.6rem; display: flex; flex-direction: column; gap: .8rem; flex: 1; }
.pc-top { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
.pc-body h3 { font-size: 1.35rem; }
.pc-body p { font-size: .95rem; }
.more { margin-top: auto; padding-top: .4rem; font-weight: 800; font-size: .82rem; letter-spacing: .08em; text-transform: uppercase; color: var(--crimson); }

.feature { padding: 1.75rem; border-top: 4px solid var(--ink); }
.feature .num { font-size: 2.4rem; font-weight: 800; color: var(--crimson); line-height: 1; margin-bottom: .9rem; }
.feature h3 { font-size: 1.15rem; margin-bottom: .6rem; }
.feature p { color: var(--muted); font-size: .95rem; }

/* ── ABOUT ── */
.about-grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 3rem; align-items: start; }
.about-text p { font-size: 1.05rem; color: var(--muted); margin-bottom: 1.2rem; }
.about-text p:first-child { color: var(--ink); font-size: 1.2rem; font-weight: 600; }
.facts { display: grid; gap: 1rem; }
.fact { padding: 1.1rem 1.25rem; border-left: 5px solid var(--crimson); }
.fact:nth-child(even) { border-left-color: var(--gold); }
.fact h4 { font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: .3rem; }
.fact p { font-weight: 700; }
.timeline { position: relative; margin-top: 1rem; padding-left: 2rem; border-left: 3px solid var(--crimson); display: grid; gap: 2rem; }
.t-item { position: relative; }
.t-item::before { content: ''; position: absolute; left: calc(-2rem - 9px); top: .35rem; width: 15px; height: 15px; background: #fff; border: 3px solid var(--crimson); }
.t-date { font-size: .78rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--crimson); }
.t-item h3 { font-size: 1.2rem; margin: .25rem 0; }

/* ── SKILLS ── */
.skill-group { padding: 1.75rem; border-top: 4px solid var(--crimson); }
.skill-group:nth-child(even) { border-top-color: var(--ink); }
.skill-group h3 { font-size: 1.15rem; margin-bottom: 1.2rem; }
.skill-row { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .7rem 0; border-top: 1px solid var(--line); }
.skill-row:first-of-type { border-top: 0; }
.skill-row b { font-size: .95rem; }
.meter { display: flex; gap: 3px; align-items: center; }
.meter span { width: 18px; height: 8px; background: var(--line); }
.meter span.on { background: var(--crimson); }
.level { font-size: .72rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); min-width: 92px; text-align: right; }

/* ── PROJECT FILTER / DETAIL ── */
.filters { display: flex; flex-wrap: wrap; gap: .6rem; margin-bottom: 2rem; }
.filter { font: 800 .8rem var(--font); letter-spacing: .1em; text-transform: uppercase; padding: .6rem 1.2rem; background: #fff; color: var(--ink); border: 2px solid var(--ink); border-radius: var(--radius); cursor: pointer; }
.filter[aria-pressed="true"], .filter:hover { background: var(--crimson); border-color: var(--crimson); color: #fff; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin: 2rem 0 0; padding: 0; }
.meta div { padding: 1rem 1.2rem; background: #fff; border: 1px solid var(--line); border-left: 5px solid var(--crimson); }
.meta dt { font-size: .72rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.meta dd { margin: .2rem 0 0; font-weight: 700; }
.frame { background: #fff; border: 2px solid var(--ink); box-shadow: 10px 10px 0 var(--crimson); cursor: zoom-in; margin-bottom: 1rem; }
.frame img { width: 100%; }
.shot { margin: 0; cursor: zoom-in; }
.shot .frame { box-shadow: 6px 6px 0 var(--ink); margin-bottom: .8rem; }
.shot figcaption { font-size: .9rem; color: var(--muted); }
.detail-block { margin-top: 4rem; }
.detail-block > h2 { font-size: 1.7rem; margin-bottom: 1.5rem; }
.detail-block > h2::after { content: ''; display: block; width: 48px; height: 4px; background: var(--crimson); margin-top: .8rem; }
.pager { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-top: 4rem; padding-top: 2rem; border-top: 2px solid var(--ink); }

/* ── CERTIFICATES ── */
.cert-card { overflow: hidden; border-top: 4px solid var(--gold); }
.cert-img { background: #fff; aspect-ratio: 592 / 393; border-bottom: 1px solid var(--line); cursor: zoom-in; }
.cert-img img { width: 100%; height: 100%; object-fit: contain; }
.cert-body { padding: 1.4rem 1.5rem 1.6rem; }
.cert-body h3 { font-size: 1.25rem; margin-bottom: .8rem; }
.cert-body li { color: var(--muted); font-size: .95rem; padding: .25rem 0 .25rem 1.1rem; position: relative; }
.cert-body li::before { content: ''; position: absolute; left: 0; top: .85rem; width: 7px; height: 7px; background: var(--crimson); }

/* ── RESUME ── */
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
.resume { background: #fff; border: 2px solid var(--ink); box-shadow: 10px 10px 0 var(--crimson); padding: clamp(1.5rem, 5vw, 3.5rem); max-width: 860px; margin: 0 auto; }
.resume header { border-bottom: 4px solid var(--crimson); padding-bottom: 1.4rem; margin-bottom: 1.8rem; }
.resume h1 { font-size: clamp(2rem, 6vw, 3rem); text-transform: uppercase; letter-spacing: -0.03em; }
.resume h1 em { font-style: normal; color: var(--crimson); }
.resume .r-role { font-weight: 700; color: var(--muted); margin: .4rem 0 .8rem; }
.r-contact { display: flex; flex-wrap: wrap; gap: .4rem 1.5rem; font-size: .9rem; font-weight: 600; }
.r-sec { margin-bottom: 1.8rem; }
.r-sec h2 { font-size: .85rem; letter-spacing: .18em; text-transform: uppercase; color: var(--crimson); margin-bottom: .8rem; padding-bottom: .4rem; border-bottom: 1px solid var(--line); }
.r-item { margin-bottom: 1rem; }
.r-item h3 { font-size: 1.05rem; }
.r-item .when { font-size: .85rem; font-weight: 700; color: var(--muted); }
.r-item ul { margin-top: .4rem; }
.r-item li { font-size: .95rem; color: var(--muted); padding-left: 1rem; position: relative; margin: .15rem 0; }
.r-item li::before { content: ''; position: absolute; left: 0; top: .7rem; width: 6px; height: 6px; background: var(--crimson); }

/* ── CONTACT ── */
.contact-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 3rem; align-items: start; }
.form { display: grid; gap: 1.1rem; padding: 2rem; border-top: 4px solid var(--crimson); }
.field label { display: block; font-size: .75rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; margin-bottom: .4rem; }
.field input, .field textarea {
  width: 100%; padding: .8rem 1rem; font: 500 1rem var(--font); color: var(--ink);
  background: var(--paper); border: 2px solid var(--line); border-radius: var(--radius);
}
.field input:focus, .field textarea:focus { outline: none; border-color: var(--crimson); background: #fff; }
.field textarea { min-height: 150px; resize: vertical; }
.contact-list { display: grid; gap: 1rem; }
.contact-item { display: block; text-decoration: none; padding: 1.1rem 1.3rem; border-left: 5px solid var(--crimson); transition: transform .15s, box-shadow .15s; }
.contact-item:nth-child(even) { border-left-color: var(--gold); }
.contact-item:hover { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 var(--ink); }
.contact-item h4 { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.contact-item p { font-weight: 700; word-break: break-word; }

/* ── CTA BAND ── */
.cta-band { background: var(--crimson); color: #fff; padding: 4rem 0; text-align: center; }
.cta-band h2 { font-size: clamp(1.9rem, 5vw, 3rem); margin-bottom: .8rem; }
.cta-band p { opacity: .92; max-width: 560px; margin: 0 auto 1.8rem; }

/* ── FOOTER ── */
.footer { background: #fff; border-top: 3px solid var(--crimson); padding: 2rem 0; }
.footer-inner { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; font-size: .85rem; font-weight: 600; color: var(--muted); }
.footer-links { display: flex; gap: 1.2rem; flex-wrap: wrap; }
.footer-links a { text-decoration: none; font-weight: 700; }
.footer-links a:hover { color: var(--crimson); }
.edit-toggle { background: none; border: 0; padding: 0; font: 600 .78rem var(--font); color: var(--muted); text-decoration: underline; cursor: pointer; }

/* ── EDIT MODE (drop zones) ── */
.dropzone { margin-top: 2rem; padding: 2.2rem 1.5rem; text-align: center; border: 2px dashed var(--crimson); background: var(--blush); border-radius: var(--radius); cursor: pointer; }
.dropzone.over { background: #f6d6d4; border-style: solid; }
.dropzone h4 { font-size: 1.1rem; margin-bottom: .3rem; }
.dropzone p { font-size: .88rem; color: var(--muted); }
.dropzone svg { margin: 0 auto .6rem; color: var(--crimson); }
.edit-note { margin-top: 1.5rem; padding: .8rem 1rem; background: #fff; border-left: 5px solid var(--gold); font-size: .88rem; color: var(--muted); }
.remove { margin-top: .8rem; background: none; border: 0; padding: 0; font: 700 .8rem var(--font); color: var(--crimson); text-decoration: underline; cursor: pointer; }

/* ── LIGHTBOX ── */
.lightbox { position: fixed; inset: 0; z-index: 200; display: none; align-items: center; justify-content: center; padding: 2rem; background: rgba(246,243,236,.97); cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 86vh; object-fit: contain; border: 2px solid var(--ink); background: #fff; box-shadow: 10px 10px 0 var(--crimson); }
.lb-close { position: absolute; top: calc(1rem + env(safe-area-inset-top, 0px)); right: 1.2rem; width: 46px; height: 46px; background: var(--crimson); color: #fff; border: 0; border-radius: var(--radius); font-size: 1.6rem; line-height: 1; cursor: pointer; }

/* ── RESPONSIVE ── */
@media (max-width: 900px) {
  .about-grid, .contact-grid { grid-template-columns: 1fr; }
  .nav-inner { justify-content: flex-end; }
  .nav-toggle { display: inline-block; }
  .nav-links {
    display: none; position: absolute; top: 100%; left: 0; right: 0; background: #fff; flex-direction: column;
    align-items: stretch; padding: .75rem 1.5rem 1.25rem; border-bottom: 3px solid var(--crimson);
  }
  .nav.open .nav-links { display: flex; }
  .nav-links a { padding: .85rem .2rem; border-bottom: 1px solid var(--line); }
  .nav-links a[aria-current="page"]::after { display: none; }
  .nav-links a[aria-current="page"] { color: var(--crimson); }
  .nav-links a.nav-cta { margin: .75rem 0 0; text-align: center; border-bottom: 0; }
}
@media (max-width: 560px) {
  .portrait { width: 190px; height: 240px; box-shadow: 10px 10px 0 var(--crimson); }
  .section { padding: 3.5rem 0; }
  .stat { padding: 1.2rem .5rem; }
  .level { display: none; }
  .role::before, .role::after { display: none; }
}

/* ── PRINT (resume) ── */
@media print {
  .nav, .footer, .no-print, .lightbox { display: none !important; }
  body { background: #fff; }
  .page-head { display: none; }
  .page-body { padding: 0; }
  .resume { border: 0; box-shadow: none; padding: 0; max-width: none; }
}
</style>
</head>
<body>

<nav class="nav" id="nav" aria-label="Main">
  <div class="nav-inner">
    <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="navLinks">Menu</button>
    <div class="nav-links" id="navLinks">
      <a href="#/home" data-nav="home">Home</a>
      <a href="#/about" data-nav="about">About</a>
      <a href="#/skills" data-nav="skills">Skills</a>
      <a href="#/projects" data-nav="projects">Projects</a>
      <a href="#/certificates" data-nav="certificates">Certificates</a>
      <a href="#/resume" data-nav="resume">Resume</a>
      <a href="#/contact" data-nav="contact" class="nav-cta">Hire me</a>
    </div>
  </div>
</nav>

<main id="view" tabindex="-1"></main>

<footer class="footer">
  <div class="container footer-inner">
    <div id="footCopy"></div>
    <div class="footer-links">
      <a href="#/projects">Projects</a>

      <div class="section-head"><div><div class="eyebrow">Credentials</div><h2 class="h2">Certifications</h2></div>
      <a class="link-more" href="#/certificates">View all ${arrow}</a></div>
      <div class="grid grid-2">${CERTS.map(certCard).join('')}</div>
    </div></section>
    ${cta}`;
  },

  about() {
    return `${pageHead('About', 'About me', PROFILE.looking)}
    <div class="page-body"><div class="container">
      <div class="about-grid">
        <div class="about-text">${PROFILE.about.map(t => `<p>${t}</p>`).join('')}
          <div class="cta" style="justify-content:flex-start;margin-top:1.5rem">
            <a class="btn btn-primary" href="#/resume">See my resume</a><a class="btn" href="#/contact">Contact me</a>
          </div>
        </div>
        <div class="facts">
          <div class="card fact"><h4>Education</h4><p>${PROFILE.degree}, ${PROFILE.school}</p></div>
          <div class="card fact"><h4>Location</h4><p>${PROFILE.location}</p></div>
          <div class="card fact"><h4>Languages</h4><p>${PROFILE.languages}</p></div>
          <div class="card fact"><h4>Interests</h4><p>${PROFILE.interests}</p></div>
        </div>
      </div>
      <div class="detail-block">
        <h2>Education &amp; training</h2>
        <div class="timeline">
          <div class="t-item"><div class="t-date">Currently studying</div><h3>${PROFILE.degree}</h3><p class="muted">${PROFILE.school}</p></div>
          <div class="t-item"><div class="t-date">August 2026</div><h3>AI Essentials: Theory and Practice</h3><p class="muted">University of the Philippines Open University, 16 hours of training</p></div>
          <div class="t-item"><div class="t-date">Certification</div><h3>Certified Information Technology Specialist</h3><p class="muted">Academic Council Technical Education (ACTE)</p></div>
        </div>
      </div>
    </div></div>
    ${cta}`;
  },

  skills() {
    return `${pageHead('Skills', 'Skills &amp; tools', 'The languages, tools and practices I use to build and ship web systems.')}
    <div class="page-body"><div class="container"><div class="grid grid-2">
      ${SKILLS.map(g => `
        <div class="card skill-group"><h3>${g.group}</h3>
          ${g.items.map(([n, l]) => `
            <div class="skill-row"><b>${n}</b>
              <div style="display:flex;align-items:center;gap:.8rem">
                <div class="meter" role="img" aria-label="${LEVELS[l]}">${[1,2,3,4,5].map(i => `<span class="${i <= l ? 'on' : ''}"></span>`).join('')}</div>
                <span class="level">${LEVELS[l]}</span>
              </div>
            </div>`).join('')}
        </div>`).join('')}
    </div></div></div>
    ${cta}`;
  },

  projects() {
    const list = PROJECTS.filter(p => projFilter === 'all' || p.type === projFilter);
    return `${pageHead('Projects', 'Projects', 'Systems and portals I have designed and built. Open a project to read its case study.')}
    <div class="page-body"><div class="container">
      <div class="filters" role="group" aria-label="Filter projects">
        ${[['all','All'],['system','Systems'],['web','Web']].map(([k,l]) => `<button class="filter" type="button" data-filter="${k}" aria-pressed="${projFilter === k}">${l}</button>`).join('')}
      </div>
      <div class="grid grid-2">${list.map(projectCard).join('')}${projFilter === 'all' ? extraProjects.map(extraProjectCard).join('') : ''}</div>
      ${dropzone('project', 'Add a project screenshot')}
    </div></div>
    ${cta}`;
  },

  project(p) {
    const i = PROJECTS.indexOf(p);
    const prev = PROJECTS[(i - 1 + PROJECTS.length) % PROJECTS.length];
    const next = PROJECTS[(i + 1) % PROJECTS.length];
    const shots = p.shots.filter(sh => sh[0] !== p.cover);
    return `${pageHead(`<a href="#/projects">Projects</a> / ${p.title}`, p.title, p.subtitle)}
    <div class="page-body"><div class="container">
      <dl class="meta">${p.meta.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>
      <div class="frame" data-zoom style="margin-top:2.5rem"><img src="${p.cover}" alt="${p.title} overview"></div>

      <div class="detail-block"><h2>Overview</h2><p class="muted" style="max-width:760px;font-size:1.1rem">${p.overview}</p>
        <div class="tags" style="margin-top:1.2rem">${p.tags.map(t => `<span class="tag red">${t}</span>`).join('')}</div></div>

      <div class="detail-block"><h2>Key features</h2>
        <div class="grid grid-3">${p.highlights.map(([t, d], n) => `
          <div class="card feature"><div class="num">0${n + 1}</div><h3>${t}</h3><p>${d}</p></div>`).join('')}</div></div>

      ${p.stack.length ? `<div class="detail-block"><h2>Technical highlights</h2>
        <div class="grid grid-3">${p.stack.map(([t, d]) => `<div class="card feature" style="border-top-color:var(--crimson)"><h3>${t}</h3><p>${d}</p></div>`).join('')}</div></div>` : ''}

      ${shots.length ? `<div class="detail-block"><h2>More screens</h2>
        <div class="grid grid-2">${shots.map(([src, cap]) => `
          <figure class="shot" data-zoom><div class="frame"><img src="${src}" alt="${cap}" loading="lazy"></div><figcaption>${cap}</figcaption></figure>`).join('')}</div></div>` : ''}

      <div class="pager">
        <a class="btn" href="#/project/${prev.id}">&larr; ${prev.title}</a>
        <a class="btn btn-primary" href="#/project/${next.id}">${next.title} ${arrow}</a>
      </div>
    </div></div>`;
  },

  certificates() {
    return `${pageHead('Certificates', 'Certifications &amp; training', 'Verified courses and credentials. Click a certificate to view it larger.')}
    <div class="page-body"><div class="container">
      <div class="grid grid-2">${CERTS.map(certCard).join('')}${extraCerts.map(extraCertCard).join('')}</div>
      ${dropzone('cert', 'Add a certificate image')}
    </div></div>
    ${cta}`;
  },

  resume() {
    return `${pageHead('Resume', 'Resume', 'A one-page summary you can print or save as a PDF.')}
    <div class="page-body"><div class="container">
      <div class="toolbar no-print">
        <p class="muted small">Tip: in the print window choose &ldquo;Save as PDF&rdquo;.</p>
        <button class="btn btn-primary" type="button" data-action="print">Print / Save as PDF</button>
      </div>
      <article class="resume">
        <header>
          <h1>${PROFILE.first} <em>${PROFILE.last}</em></h1>
          <p class="r-role">${PROFILE.role}</p>
          <div class="r-contact"><span>${PROFILE.email}</span><span>${PROFILE.phone}</span></div>
        </header>
        <section class="r-sec"><h2>Summary</h2><p class="muted">${PROFILE.about[0]} ${PROFILE.about[2]}</p></section>
        <section class="r-sec"><h2>Education</h2>
          <div class="r-item"><h3>${PROFILE.degree}</h3><div class="when">${PROFILE.school}</div></div></section>
        <section class="r-sec"><h2>Projects</h2>
          ${PROJECTS.map(p => `<div class="r-item"><h3>${p.title}</h3><div class="when">${p.subtitle}</div>
            <ul>${p.highlights.map(h => `<li>${h[1]}</li>`).join('')}</ul></div>`).join('')}</section>
        <section class="r-sec"><h2>Skills</h2>
          ${SKILLS.map(g => `<div class="r-item" style="margin-bottom:.5rem"><b>${g.group}:</b> <span class="muted">${g.items.map(i => i[0]).join(', ')}</span></div>`).join('')}</section>
        <section class="r-sec"><h2>Certifications</h2>
          ${CERTS.map(c => `<div class="r-item"><h3>${c.name}</h3><div class="when">${c.lines[0]}</div></div>`).join('')}</section>
      </article>
    </div></div>`;
  },

  contact() {
    const items = [
      ['Email', PROFILE.email, `mailto:${PROFILE.email}`],
      ['Phone', PROFILE.phone, `tel:${PROFILE.phone.replace(/\s+/g, '')}`]
    ];
    return `${pageHead('Contact', 'Contact', PROFILE.looking + ' Send a message and I will get back to you.')}
    <div class="page-body"><div class="container"><div class="contact-grid">
      <form class="card form" id="contactForm">
        <div class="field"><label for="cName">Your name</label><input id="cName" name="name" required autocomplete="name" placeholder="Juan Dela Cruz"></div>
        <div class="field"><label for="cEmail">Your email</label><input id="cEmail" name="email" type="email" required autocomplete="email" placeholder="you@company.com"></div>
        <div class="field"><label for="cSubject">Subject</label><input id="cSubject" name="subject" placeholder="Internship, project, collaboration"></div>
        <div class="field"><label for="cMsg">Message</label><textarea id="cMsg" name="message" required placeholder="Tell me about the role or project."></textarea></div>
        <button class="btn btn-primary" type="submit" style="justify-self:start">Send message ${arrow}</button>
        <p class="muted small">This opens your email app with the message ready to send.</p>
      </form>
      <div class="contact-list">${items.map(([h, t, href]) => `
        <a class="card contact-item" href="${href}"><h4>${h}</h4><p>${t}</p></a>`).join('')}</div>
    </div></div></div>`;
  },

  notfound() {
    return `${pageHead('Not found', 'Page not found', 'That page does not exist.')}
    <div class="page-body"><div class="container"><a class="btn btn-primary" href="#/home">Back to home</a></div></div>`;
  }
};

/* ── router ── */
function parseHash() {
  const [page, arg] = location.hash.replace(/^#\/?/, '').split('/');
  return { page: page || 'home', arg };
}
function renderRoute(scroll = true) {
  const { page, arg } = parseHash();
  let html, title = fullName, navKey = page;
  if (page === 'project') {
    const p = PROJECTS.find(x => x.id === arg);
    html = p ? V.project(p) : V.notfound();
    if (p) title = p.title + ' | ' + fullName;
    navKey = 'projects';
  } else if (V[page] && page !== 'notfound') {
    html = V[page]();
    title = (page === 'home' ? fullName + ' | ' + PROFILE.role : page[0].toUpperCase() + page.slice(1) + ' | ' + fullName);
  } else { html = V.notfound(); }
  view.innerHTML = html;
  document.title = title;
  document.querySelectorAll('[data-nav]').forEach(a => {
    if (a.dataset.nav === navKey) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  nav.classList.remove('open');
  document.getElementById('navToggle').setAttribute('aria-expanded', 'false');
  if (scroll) { window.scrollTo(0, 0); view.focus({ preventScroll: true }); }
}
window.addEventListener('hashchange', () => renderRoute(true));

/* ── lightbox ── */
const lb = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
function openLightbox(src, alt) { lbImg.src = src; lbImg.alt = alt || ''; lb.classList.add('open'); document.body.style.overflow = 'hidden'; }
function closeLightbox() { lb.classList.remove('open'); document.body.style.overflow = ''; }
lb.addEventListener('click', closeLightbox);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

/* ── uploads (edit mode) ── */
function readFiles(files, kind) {
  [...files].forEach(file => {
    if (!file.type.startsWith('image/')) return;
    const r = new FileReader();
    r.onload = ev => {
      const name = file.name.replace(/\.[^.]+$/, '');
      (kind === 'cert' ? extraCerts : extraProjects).push({ title: name, name, img: ev.target.result });
      renderRoute(false);
    };
    r.readAsDataURL(file);
  });
}

/* ── delegated events ── */
document.addEventListener('click', e => {
  const t = e.target;
  const zoom = t.closest('[data-zoom]');
  if (zoom && !t.closest('[contenteditable]') && !t.closest('button')) {
    const img = zoom.querySelector('img'); if (img) { openLightbox(img.src, img.alt); return; }
  }
  const f = t.closest('[data-filter]');
  if (f) { projFilter = f.dataset.filter; renderRoute(false); return; }
  if (t.closest('[data-action="print"]')) { window.print(); return; }
  const rp = t.closest('[data-remove-project]'); if (rp) { extraProjects.splice(+rp.dataset.removeProject, 1); renderRoute(false); return; }
  const rc = t.closest('[data-remove-cert]'); if (rc) { extraCerts.splice(+rc.dataset.removeCert, 1); renderRoute(false); return; }
  const dz = t.closest('.dropzone');
  if (dz && !t.closest('input')) { dz.querySelector('input').click(); return; }
});
document.addEventListener('keydown', e => {
  const dz = e.target.closest && e.target.closest('.dropzone');
  if (dz && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); dz.querySelector('input').click(); }
});
document.addEventListener('change', e => {
  if (e.target.classList.contains('file-input')) readFiles(e.target.files, e.target.closest('.dropzone').dataset.kind);
});
document.addEventListener('dragover', e => { const z = e.target.closest && e.target.closest('.dropzone'); if (z) { e.preventDefault(); z.classList.add('over'); } });
document.addEventListener('dragleave', e => { const z = e.target.closest && e.target.closest('.dropzone'); if (z) z.classList.remove('over'); });
document.addEventListener('drop', e => {
  const z = e.target.closest && e.target.closest('.dropzone');
  if (z) { e.preventDefault(); z.classList.remove('over'); readFiles(e.dataTransfer.files, z.dataset.kind); }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'contactForm') return;
  e.preventDefault();
  const d = new FormData(e.target);
  const subject = d.get('subject') || 'Portfolio inquiry from ' + d.get('name');
  const body = d.get('message') + '\n\n' + d.get('name') + '\n' + d.get('email');
  window.location.href = 'mailto:' + PROFILE.email + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
});

/* ── nav toggle, owner toggle, footer ── */
document.getElementById('navToggle').addEventListener('click', () => {
  const open = nav.classList.toggle('open');
  document.getElementById('navToggle').setAttribute('aria-expanded', open);
});
document.getElementById('ownerToggle').addEventListener('click', e => {
  owner = !owner;
  e.target.textContent = owner ? 'Exit edit mode' : 'Edit mode';
  renderRoute(false);
});
document.getElementById('footCopy').textContent = '\u00A9 2026 ' + fullName + '. All rights reserved.';

renderRoute(false);
</script>
</body>
</html>
